services:
  - type: web
    name: tuxtla-backend
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
